name: Build aRDP Pro APK

on:
  workflow_dispatch: # Allows manual execution from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4
      with:
        submodules: 'recursive' # Vital: aRDP relies on FreeRDP native code submodules

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Setup Android SDK & NDK
      uses: android-actions/setup-android@v3
      with:
        cmdline-tools-version: 'latest'
        packages: |
          platform-tools
          platforms;android-36
          build-tools;35.0.0
          ndk;26.3.11579264

    - name: Install Native Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build

    - name: Grant Execute Permission for Gradle
      run: chmod +x ./gradlew

    - name: Build Pro Release APK
      run: ./gradlew :aRDP:assembleProRelease --stacktrace

    - name: Upload Pro APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: aRDP-Pro-Release-APK
        path: aRDP/build/outputs/apk/pro/release/*.apk
